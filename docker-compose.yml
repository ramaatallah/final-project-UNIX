# =============================================================================
# docker-compose.yml – Recommendation System
# =============================================================================
# Services:
#   db      – MySQL 8.0 database
#   backend – Node.js / Express API + static frontend
#
# Usage:
#   docker compose up --build          # first run (builds images + starts)
#   docker compose up -d               # detached mode
#   docker compose down -v             # stop and remove containers + volumes
# =============================================================================

version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes (data persists across container restarts)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Internal bridge network – containers talk to each other by service name
# ─────────────────────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge

# =============================================================================
services:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. DATABASE SERVICE
  # ─────────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0          # Official MySQL image – pinned version for reproducibility
    container_name: recommendation_db
    restart: unless-stopped   # Auto-restart on crash; stop manually with `docker compose down`

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}   # Change in production!
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-recommendation_db}
      MYSQL_USER:          ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-apppassword}

    volumes:
      # Persist database files across container restarts
      - mysql_data:/var/lib/mysql
      # Auto-run the SQL init script on first startup (creates tables + seeds data)
      - ./database/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro

    networks:
      - app_network

    # Healthcheck: ensures MySQL is truly ready before the backend starts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s   # Give MySQL time to initialize on first run

    # Do NOT expose port 3306 to the host in production.
    # Uncomment the next two lines only for local debugging:
    # ports:
    #   - "3306:3306"

  # ─────────────────────────────────────────────────────────────────────────
  # 2. BACKEND SERVICE (also serves the frontend as static files)
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .            # Build context is the project ROOT (so COPY ../index.html works)
      dockerfile: backend/Dockerfile
    container_name: recommendation_backend
    restart: unless-stopped

    environment:
      # These values are passed into db.js via process.env.*
      MYSQL_HOST:     db                                         # Must match the service name above
      MYSQL_PORT:     3306
      MYSQL_USER:     ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recommendation_db}
      NODE_ENV:       production

    ports:
      - "3000:3000"         # Host port 3000 → Container port 3000

    depends_on:
      db:
        condition: service_healthy   # Wait for DB healthcheck to pass before starting

    networks:
      - app_network
