version: '3.8'

services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: recommendation_db
    ports:
      - "3307:3306"

  backend:
    build: ./backend
    ports:
      - "8080:3000"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 8080
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_DATABASE: recommendation_db
    depends_on:
      - db